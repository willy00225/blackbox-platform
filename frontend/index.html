<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    
    <!-- ====== ANTI-CACHE RADICAL (Pour éviter la page blanche mobile) ====== -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- ====== FIN ANTI-CACHE ====== -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    
    <!-- Balises PWA / iOS -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Black Box">
    <link rel="apple-touch-icon" href="/icons/logo-192.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/icons/logo-192.png" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <title>Black Box - Cinéma Mobile Africain</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- ✅ Ajout d'un paramètre de version pour forcer le rechargement du bundle -->
    <!-- Changez ?v=2 en ?v=3, ?v=4... à chaque déploiement majeur -->
    <script type="module" src="/src/main.jsx?v=2"></script>
